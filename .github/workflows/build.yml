
name: 构建测试apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "构建测试apk"
    runs-on: ubuntu-latest

    steps:  
      - name: 1 下载项目源码  
        uses: actions/checkout@v4  

      - name: 2 安装依赖  
        run: |  
          sudo apt update  
          sudo apt install -y libarchive-tools wget  

      - name: 3 配置 Java  
        uses: actions/setup-java@v4  
        with:  
          distribution: temurin  
          java-version: '17'  
          cache: gradle

      - name: 4 安装指定版本的 CMake (3.22.1)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      - name: 5 构建 APK  
        run: |  
          pwd  
          ls -la  
          chmod +x ./gradlew  
          ./gradlew assembleDebug  

      - name: 6 上传 APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: winlator-debug  
          path: app/build/outputs/apk/debug/app-debug.apk
