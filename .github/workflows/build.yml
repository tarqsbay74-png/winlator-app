name: Replace repository with Winlator source

on:
workflow_dispatch:

permissions:
contents: write

jobs:
replace:
name: Replace repository files
runs-on: ubuntu-latest

steps:
  - name: 1 Checkout current repository
    uses: actions/checkout@v4
    with:
      path: current
      ref: ${{ github.ref_name }}
      fetch-depth: 0

  - name: 2 Checkout source repository
    uses: actions/checkout@v4
    with:
      repository: brunodev85/winlator-app
      ref: 5c199d5d66ba84d805934e31f5205ff42e4a0d58
      path: source
      fetch-depth: 1

  - name: 3 Install dependencies
    run: |
      sudo apt update
      sudo apt install -y rsync

  - name: 4 Replace current repository files
    run: |
      rsync -a --delete --exclude='.git/' source/ current/

  - name: 5 Commit and push changes
    working-directory: current
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Replace repository with upstream Winlator commit 5c199d5"
      git push origin "HEAD:${GITHUB_REF_NAME}"